name: Deploy to GitHub Pages

on:
  push:
    branches: [main]
  # 「Actions」タブから手動でも流せるようにしておく
  workflow_dispatch:

# Pages への書き込みに必要な権限だけを与える
permissions:
  contents: read
  pages: write
  id-token: write

# 走行中のデプロイは中断せず、後続を1本だけ待たせる
concurrency:
  group: pages
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: 依存をインストール
        run: npm ci

      - name: Lint
        run: npx eslint src --max-warnings 0

      - name: ビルド（out/ に静的書き出し）
        run: npm run build
        env:
          NEXT_PUBLIC_SITE_URL: https://shimano-yuuki.github.io

      - uses: actions/configure-pages@v5

      - uses: actions/upload-pages-artifact@v3
        with:
          path: ./out

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
